spring:
  application:
    name: spring-boot-keycloak-platform

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: Spring Boot Keycloak Platform
    description: Modular monolith backend platform
    version: 0.0.1-SNAPSHOT
