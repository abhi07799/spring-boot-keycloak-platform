spring:
  application:
    name: spring-boot-keycloak-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: platform-app-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/platform}
      client:
        registration:
          keycloak-admin:
            provider: keycloak-admin
            client-id: platform-admin-service
            client-secret: ${KEYCLOAK_ADMIN_SERVICE_CLIENT_SECRET:replace-after-first-realm-import}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
        provider:
          keycloak-admin:
            token-uri: ${KEYCLOAK_ADMIN_TOKEN_URI:http://localhost:8081/realms/platform/protocol/openid-connect/token}

keycloak:
  admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_ADMIN_REALM:platform}

server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: ${SWAGGER_OAUTH2_REDIRECT_URL:http://localhost:8080/swagger-ui/oauth2-redirect.html}
    oauth:
      client-id: platform-swagger
      use-pkce-with-authorization-code-grant: true
      scopes:
        - openid
    persist-authorization: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: Spring Boot Keycloak Platform
    description: Modular monolith backend platform
    version: 0.0.1-SNAPSHOT
