name: spring-boot-keycloak-platform

services:
  app-db:
    image: postgres:16
    container_name: platform-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-platform}
      POSTGRES_USER: ${APP_DB_USER:-platform}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5433}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$${POSTGRES_USER} -d $$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak-db:
    image: postgres:16
    container_name: platform-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_DB_PORT:-5434}:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$${POSTGRES_USER} -d $$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: platform-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-enabled=true", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8081}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-network
      - keycloak-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0;
          grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  app-network:
    driver: bridge
  keycloak-network:
    driver: bridge

volumes:
  app-db-data:
  keycloak-db-data:
